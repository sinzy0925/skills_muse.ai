  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: Within 14 days a later artifact or Space fix is reported as changed and awaiting a real device test when the audit environment cannot reproduce it, or as verified from the edited content and the user confirmation, with no claim of fixed before that confirmation. If no such fix occurs in the window the result is inconclusive rather than a failure.
